name: Release Extension

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release from tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=SoundCloud Control v${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          node scripts/create-release-notes.mjs "$TAG" "$RUNNER_TEMP/release-body.md"

      - name: Type-check
        run: pnpm compile

      - name: Build browser packages
        run: pnpm zip:all

      - name: Show generated artifacts
        shell: bash
        run: ls -lah .output/*.zip

      - name: Zip Source Code
        run: zip -r ./Source.zip . -x "node_modules/*" ".git/*" ".github/*" "dist/*" ".output/*" "*.zip"

      - name: Sign and Publish to Firefox Add-on Store
        continue-on-error: true
        env:
          FIREFOX_ISSUER: ${{ secrets.FIREFOX_ISSUER }}
          FIREFOX_SECRET: ${{ secrets.FIREFOX_SECRET }}
        run: |
          pnpm add -D web-ext
          npx web-ext sign --channel listed -s ./dist/firefox/ --upload-source-code ./Source.zip --artifacts-dir ./.output --api-key $FIREFOX_ISSUER --api-secret $FIREFOX_SECRET

      - name: Rename Firefox artifact
        continue-on-error: true
        run: |
          FIREFOX_XPI=$(ls ./.output/*.xpi 2>/dev/null | head -1)
          if [ -f "$FIREFOX_XPI" ]; then
            mv "$FIREFOX_XPI" ./.output/soundcloud-control-firefox.xpi
          fi

      - name: Publish to Chrome Web Store
        continue-on-error: true
        uses: wdzeng/chrome-extension@v1
        with:
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          zip-path: ./.output/soundcloud-control.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            .output/*.zip
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          fail_on_unmatched_files: true
          overwrite_files: true