name: Release Extension

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release from tag
    runs-on: ubuntu-latest
    env:
      HAS_FIREFOX_PUBLISHING: ${{ secrets.FIREFOX_ISSUER != '' && secrets.FIREFOX_SECRET != '' }}
      HAS_CHROME_PUBLISHING: ${{ secrets.CHROME_CLIENT_ID != '' && secrets.CHROME_CLIENT_SECRET != '' && secrets.CHROME_REFRESH_TOKEN != '' && secrets.CHROME_EXTENSION_ID != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=SoundCloud Control v${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          node scripts/create-release-notes.mjs "$TAG" "$RUNNER_TEMP/release-body.md"

      - name: Type-check
        run: pnpm compile

      - name: Build browser packages
        run: pnpm zip:all

      - name: Show generated artifacts
        shell: bash
        run: ls -lah .output/*.zip

      - name: Resolve artifact paths
        id: artifacts
        shell: bash
        run: |
          shopt -s nullglob
          chrome=(.output/*-chrome.zip)
          firefox=(.output/*-firefox.zip)
          sources=(.output/*-sources.zip)

          [[ ${#chrome[@]} -eq 1 ]] || {
            echo "Expected exactly one Chrome zip in .output" >&2
            ls -lah .output
            exit 1
          }

          [[ ${#firefox[@]} -eq 1 ]] || {
            echo "Expected exactly one Firefox zip in .output" >&2
            ls -lah .output
            exit 1
          }

          [[ ${#sources[@]} -eq 1 ]] || {
            echo "Expected exactly one sources zip in .output" >&2
            ls -lah .output
            exit 1
          }

          [[ -f .output/firefox-mv2/manifest.json ]] || {
            echo "Missing Firefox build output at .output/firefox-mv2/manifest.json" >&2
            find .output -maxdepth 2 -type f | sort
            exit 1
          }

          echo "chrome_zip=${chrome[0]}" >> "$GITHUB_OUTPUT"
          echo "firefox_zip=${firefox[0]}" >> "$GITHUB_OUTPUT"
          echo "source_zip=${sources[0]}" >> "$GITHUB_OUTPUT"
          echo "firefox_dir=.output/firefox-mv2" >> "$GITHUB_OUTPUT"

      - name: Sign and Publish to Firefox Add-on Store
        id: firefox_publish
        if: ${{ env.HAS_FIREFOX_PUBLISHING == 'true' }}
        continue-on-error: true
        env:
          FIREFOX_ISSUER: ${{ secrets.FIREFOX_ISSUER }}
          FIREFOX_SECRET: ${{ secrets.FIREFOX_SECRET }}
        run: |
          pnpm exec web-ext sign \
            --channel listed \
            -s "${{ steps.artifacts.outputs.firefox_dir }}" \
            --upload-source-code "${{ steps.artifacts.outputs.source_zip }}" \
            --artifacts-dir ./.output \
            --api-key "$FIREFOX_ISSUER" \
            --api-secret "$FIREFOX_SECRET"

      - name: Rename Firefox artifact
        if: ${{ steps.firefox_publish.outcome == 'success' }}
        shell: bash
        run: |
          FIREFOX_XPI=$(find ./.output -maxdepth 1 -name '*.xpi' | head -1)
          if [[ -z "$FIREFOX_XPI" ]]; then
            echo "Firefox signing succeeded but no XPI was generated" >&2
            exit 1
          fi

          mv "$FIREFOX_XPI" ./.output/soundcloud-control-firefox.xpi

      - name: Publish to Chrome Web Store
        if: ${{ env.HAS_CHROME_PUBLISHING == 'true' }}
        continue-on-error: true
        uses: wdzeng/chrome-extension@v1
        with:
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          zip-path: ${{ steps.artifacts.outputs.chrome_zip }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            .output/*.zip
            .output/*.xpi
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          fail_on_unmatched_files: false
          overwrite_files: true
